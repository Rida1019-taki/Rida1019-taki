<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&amp;display=swap');

            .term-bg { fill: #10070C; }
            .term-bar { fill: #190B12; }
            .term-dot-1 { fill: #701A3D; }
            .term-dot-2 { fill: #A22B58; }
            .term-dot-3 { fill: #C77B9B; }
            .term-title { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #8E5B70; font-weight: 600; }

            .ascii-back {
                font-family: 'JetBrains Mono', ui-monospace, monospace;
                font-size: 110px;
                font-weight: 900;
                letter-spacing: 12px;
                fill: none;
                stroke: #701A3D;
                stroke-width: 3.5;
                opacity: 0.35;
            }

            .ascii-main {
                font-family: 'JetBrains Mono', ui-monospace, monospace;
                font-size: 110px;
                font-weight: 900;
                letter-spacing: 12px;
                fill: url(#wm-text-grad);
                filter: drop-shadow(0 0 24px rgba(199, 123, 155, 0.45));
            }

            .prompt-txt { font-family: 'JetBrains Mono', monospace; font-size: 18px; fill: #C77B9B; }
            .cursor-block { fill: #E5B5C7; }

            @media (prefers-reduced-motion: reduce) {
              .wm-anim { animation: none !important; }
            }
        </style>

        <linearGradient id="wm-text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="35%" stop-color="#F8F0F3" />
            <stop offset="70%" stop-color="#E5B5C7" />
            <stop offset="100%" stop-color="#C77B9B" />
        </linearGradient>

        <linearGradient id="wm-border" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#451126" stop-opacity="0.3" />
            <stop offset="50%" stop-color="#701A3D" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#451126" stop-opacity="0.3" />
        </linearGradient>

        <pattern id="wm-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
        </pattern>

        <clipPath id="wm-wave-clip">
            <rect x="-300" y="60" width="350" height="400">
                <animate attributeName="x" values="-300; 1100" dur="4s" repeatCount="indefinite" />
            </rect>
        </clipPath>
    </defs>

    <!-- Terminal Background -->
    <rect class="term-bg" width="1000" height="520" rx="16" />
    <rect x="0.5" y="0.5" width="999" height="519" rx="16" fill="none" stroke="url(#wm-border)" stroke-width="1.2" />

    <!-- Title Bar -->
    <path class="term-bar" d="M 0,16 A 16,16 0 0,1 16,0 L 984,0 A 16,16 0 0,1 1000,16 L 1000,48 L 0,48 Z" />
    <circle class="term-dot-1" cx="28" cy="24" r="6" />
    <circle class="term-dot-2" cx="48" cy="24" r="6" />
    <circle class="term-dot-3" cx="68" cy="24" r="6" />
    <text class="term-title" x="500" y="29" text-anchor="middle">sushmita@matrix: ~$ ./banner.sh --burgundy</text>

    <!-- Prompt Top -->
    <text class="prompt-txt" x="48" y="98">
        <tspan fill="#C77B9B">sushmita@matrix</tspan>:<tspan fill="#8E5B70">~</tspan>$ cat identity.txt
    </text>

    <!-- Dynamic 3D / Wireframe Text -->
    <g>
        <text class="ascii-back" x="500" y="235" text-anchor="middle">SRI TECH</text>
        <text class="ascii-back" x="500" y="365" text-anchor="middle">SUSHMITA</text>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -3 -2; 3 2; -2 2; 0 0"
                          keyTimes="0; 0.25; 0.5; 0.75; 1"
                          dur="5s" repeatCount="indefinite" />

        <text class="ascii-main" x="500" y="235" text-anchor="middle">SRI TECH</text>
        <text class="ascii-main" x="500" y="365" text-anchor="middle">SUSHMITA</text>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 2 2; -2 -2; 2 1; 0 0"
                          keyTimes="0; 0.2; 0.5; 0.8; 1"
                          dur="6s" repeatCount="indefinite" />
    </g>

    <!-- Wave Overlay -->
    <g clip-path="url(#wm-wave-clip)">
        <text class="ascii-main" x="500" y="235" text-anchor="middle" fill="#FFFFFF" opacity="0.9">SRI TECH</text>
        <text class="ascii-main" x="500" y="365" text-anchor="middle" fill="#FFFFFF" opacity="0.9">SUSHMITA</text>
    </g>

    <!-- Scanlines -->
    <rect width="1000" height="520" fill="url(#wm-scanlines)" pointer-events="none" />

    <!-- Prompt Bottom -->
    <g>
        <text class="prompt-txt" x="48" y="468">
            <tspan fill="#C77B9B">sushmita@matrix</tspan>:<tspan fill="#8E5B70">~</tspan>$
        </text>
        <rect class="cursor-block" x="240" y="450" width="12" height="22">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
        </rect>
    </g>
</svg>
