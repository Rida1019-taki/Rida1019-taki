<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="ce-t">
  <title id="ce-t">Cisco Networking Academy Certifications</title>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ce-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1200" height="360" rx="20" fill="url(#ce-bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#ce-glow)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="19.5" fill="none" stroke="#701A3D" stroke-opacity=".35"/>

  <!-- Cert 1: Python Essentials 1 -->
  <g transform="translate(48, 48)">
    <rect width="340" height="264" rx="14" fill="#10070C" stroke="#451126" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="4" rx="2" fill="#C77B9B"/>
    <text class="ce-mono" x="24" y="38" font-size="11" letter-spacing="2" fill="#C77B9B">CISCO ACADEMY // 01</text>
    <text class="ce-serif" x="24" y="74" font-size="24" font-weight="300" fill="#F8F0F3">Python Essentials 1</text>
    <text class="ce-sans" x="24" y="104" font-size="13" fill="#B6A3AC">Foundational Python &amp; Data Structures</text>
    <line x1="24" y1="128" x2="316" y2="128" stroke="#451126"/>
    <text class="ce-mono" x="24" y="156" font-size="12" fill="#E5B5C7">ISSUER: Cisco Networking Academy</text>
    <text class="ce-mono" x="24" y="182" font-size="12" fill="#B6A3AC">TOPICS: Syntax, Control Flow, Functions</text>
    <text class="ce-mono" x="24" y="208" font-size="12" fill="#B6A3AC">VERIFIED: PDF Available in Repo</text>
    <text class="ce-mono" x="24" y="234" font-size="12" fill="#C77B9B">STATUS: Verified Credential</text>
  </g>

  <!-- Cert 2: Introduction à la cybersécurité -->
  <g transform="translate(430, 48)">
    <rect width="340" height="264" rx="14" fill="#10070C" stroke="#451126" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="4" rx="2" fill="#701A3D"/>
    <text class="ce-mono" x="24" y="38" font-size="11" letter-spacing="2" fill="#C77B9B">CISCO ACADEMY // 02</text>
    <text class="ce-serif" x="24" y="74" font-size="24" font-weight="300" fill="#F8F0F3">Cybersécurité</text>
    <text class="ce-sans" x="24" y="104" font-size="13" fill="#B6A3AC">Introduction à la Cybersécurité</text>
    <line x1="24" y1="128" x2="316" y2="128" stroke="#451126"/>
    <text class="ce-mono" x="24" y="156" font-size="12" fill="#E5B5C7">ISSUER: Cisco Networking Academy</text>
    <text class="ce-mono" x="24" y="182" font-size="12" fill="#B6A3AC">TOPICS: Threats, Privacy &amp; Data Defense</text>
    <text class="ce-mono" x="24" y="208" font-size="12" fill="#B6A3AC">VERIFIED: PDF Available in Repo</text>
    <text class="ce-mono" x="24" y="234" font-size="12" fill="#C77B9B">STATUS: Verified Credential</text>
  </g>

  <!-- Cert 3: Matériel informatique -->
  <g transform="translate(812, 48)">
    <rect width="340" height="264" rx="14" fill="#10070C" stroke="#451126" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="4" rx="2" fill="#C77B9B"/>
    <text class="ce-mono" x="24" y="38" font-size="11" letter-spacing="2" fill="#C77B9B">CISCO ACADEMY // 03</text>
    <text class="ce-serif" x="24" y="74" font-size="24" font-weight="300" fill="#F8F0F3">Matériel Informatique</text>
    <text class="ce-sans" x="24" y="104" font-size="13" fill="#B6A3AC">Les bases du matériel informatique</text>
    <line x1="24" y1="128" x2="316" y2="128" stroke="#451126"/>
    <text class="ce-mono" x="24" y="156" font-size="12" fill="#E5B5C7">ISSUER: Cisco Networking Academy</text>
    <text class="ce-mono" x="24" y="182" font-size="12" fill="#B6A3AC">TOPICS: Hardware, OS, Troubleshooting</text>
    <text class="ce-mono" x="24" y="208" font-size="12" fill="#B6A3AC">VERIFIED: PDF Available in Repo</text>
    <text class="ce-mono" x="24" y="234" font-size="12" fill="#C77B9B">STATUS: Verified Credential</text>
  </g>
</svg>