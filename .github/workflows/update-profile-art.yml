name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch GitHub contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: Rida1019-taki
      - name: Render README cards (hero, tiles, activity, repos, heatmap)
        run: python scripts/render_readme_cards.py
        env:
          GH_PROFILE_USER: Rida1019-taki
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh README SVG cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
