    <text class="tc-serif" y="32" font-size="24" fill="#F8F0F3">Server &amp; Persistence</text>
    <g transform="translate(0, 48)">
      <rect class="pill" width="120" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#F8F0F3">Spring Boot</text>
      <g transform="translate(132, 0)"><rect class="pill" width="110" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">REST APIs</text></g>
      <g transform="translate(254, 0)"><rect class="pill" width="85" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">MySQL</text></g>
      <g transform="translate(351, 0)"><rect class="pill" width="85" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">SQLite</text></g>
      <g transform="translate(448, 0)"><rect class="pill" width="95" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">Firebase</text></g>
      <g transform="translate(555, 0)"><rect class="pill" width="105" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">JWT Auth</text></g>
    </g>
  </g>

  <!-- Row 4: DevOps & Tools -->
  <g transform="translate(56, 362)">
    <text class="tc-mono" font-size="11" letter-spacing="3" fill="#C77B9B">04 // DEVOPS &amp; TOOLING</text>
    <text class="tc-serif" y="32" font-size="24" fill="#F8F0F3">Delivery &amp; Infrastructure</text>
    <g transform="translate(0, 48)">
      <rect class="pill" width="90" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#F8F0F3">Docker</text>
      <g transform="translate(102, 0)"><rect class="pill" width="85" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">Maven</text></g>
      <g transform="translate(199, 0)"><rect class="pill" width="65" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">Git</text></g>
      <g transform="translate(276, 0)"><rect class="pill" width="85" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">GitHub</text></g>
      <g transform="translate(373, 0)"><rect class="pill" width="75" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">Linux</text></g>
      <g transform="translate(460, 0)"><rect class="pill" width="90" height="34"/><text class="tc-mono" x="16" y="22" font-size="12" fill="#E5B5C7">Postman</text></g>
    </g>
