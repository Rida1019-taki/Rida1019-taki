<linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
<linearGradient id="avatarBorder" x1="0" y1="0" x2="1" y2="1">
