<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 55" width="100%" height="55">
  <style>
    @keyframes pulse-shadow {
      0%, 100% { filter: drop-shadow(0 0 1px #A78BFA); }
      50% { filter: drop-shadow(0 0 6px #22D3EE); }
    }
    .footer-line {
      stroke: url(#footer-grad);
      stroke-width: 2;
      stroke-linecap: round;
      animation: pulse-shadow 4s infinite ease-in-out;
    }
  </style>
  <defs>
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>
  <line x1="15" y1="20" x2="815" y2="20" class="footer-line"/>
  <text x="415" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="1.5">RIDA TAKI • FULL-STACK &amp; MOBILE DEVELOPER</text>
</svg>
