<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="sig-t">
  <title id="sig-t">Rida Taki — Turning ideas into clean, scalable software.</title>
  <defs>
    <linearGradient id="sig-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset="1" stop-color="#190B12"/></linearGradient>
    <radialGradient id="sig-glow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .sig-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .sig-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="220" rx="20" fill="url(#sig-bg)"/>
  <rect width="1200" height="220" rx="20" fill="url(#sig-glow)"/>
  <rect x=".5" y=".5" width="1199" height="219" rx="19.5" fill="none" stroke="#701A3D" stroke-opacity=".35"/>

  <g transform="translate(60, 65)">
    <text class="sig-mono" font-size="11" letter-spacing="3" fill="#C77B9B">ARCHITECTED &amp; ENGINEERED WITH INTENTION</text>
    <text class="sig-serif" y="48" font-size="34" font-weight="300" fill="#F8F0F3">Rida <tspan font-style="italic" fill="#E5B5C7">Taki</tspan></text>
    <text class="sig-mono" y="84" font-size="13" fill="#B6A3AC">Turning ideas into clean, scalable, and production-ready code.</text>
  </g>

  <!-- Right side decorative seal -->
  <g transform="translate(1040, 110)">
    <circle r="46" fill="#190B12" stroke="#701A3D" stroke-width="1.5"/>
    <circle r="38" fill="none" stroke="#C77B9B" stroke-width="1" stroke-dasharray="3,6"/>
    <text class="sig-mono" text-anchor="middle" y="4" font-size="11" letter-spacing="2" fill="#E5B5C7">2026</text>
  </g>
</svg>