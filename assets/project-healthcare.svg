<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="p1-t">
  <title id="p1-t">HealthCare+: Enterprise Medical Management Platform</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="p1-glow" cx="85%" cy="30%" r="60%"><stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1200" height="360" rx="20" fill="url(#p1-bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#p1-glow)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="19.5" fill="none" stroke="#701A3D" stroke-opacity=".4"/>

  <g transform="translate(56, 0)">
    <!-- Header -->
    <g transform="translate(0, 48)">
      <text class="p-mono" font-size="11" letter-spacing="3" fill="#C77B9B">FLAGSHIP ENTERPRISE SYSTEM</text>
      <text class="p-serif" y="44" font-size="38" font-weight="300" fill="#F8F0F3">HealthCare+ <tspan font-style="italic" fill="#E5B5C7">Medical Platform</tspan></text>
      <text class="p-sans" y="78" font-size="16" fill="#B6A3AC">Production-oriented healthcare platform designed for patient records, clinical scheduling, and role-based access.</text>
    </g>

    <!-- Metrics Grid -->
    <g transform="translate(0, 168)">
      <!-- Box 1 -->
      <g>
        <rect width="250" height="130" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
        <text class="p-mono" x="20" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">CORE ARCHITECTURE</text>
        <text class="p-serif" x="20" y="68" font-size="24" fill="#F8F0F3">Spring Boot + React</text>
        <text class="p-sans" x="20" y="98" font-size="12" fill="#B6A3AC">REST APIs · MySQL · JWT Auth</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(270, 0)">
        <rect width="250" height="130" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
        <text class="p-mono" x="20" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">DOMAIN MODEL</text>
        <text class="p-serif" x="20" y="68" font-size="24" fill="#F8F0F3">Multi-Module</text>
        <text class="p-sans" x="20" y="98" font-size="12" fill="#B6A3AC">Doctors · Patients · Appointments</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(540, 0)">
        <rect width="250" height="130" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
        <text class="p-mono" x="20" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">CONTAINERIZATION</text>
        <text class="p-serif" x="20" y="68" font-size="24" fill="#F8F0F3">Docker Ready</text>
        <text class="p-sans" x="20" y="98" font-size="12" fill="#B6A3AC">Isolated services &amp; persistence</text>
      </g>
      <!-- Box 4 -->
      <g transform="translate(810, 0)">
        <rect width="278" height="130" rx="12" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
        <text class="p-mono" x="20" y="32" font-size="11" letter-spacing="2" fill="#E5B5C7">ACCESS &amp; SECURITY</text>
        <text class="p-serif" x="20" y="68" font-size="24" fill="#F8F0F3">Strict RBAC</text>
        <text class="p-sans" x="20" y="98" font-size="12" fill="#B6A3AC">Secured endpoints &amp; token refresh</text>
      </g>
    </g>
  </g>
</svg>