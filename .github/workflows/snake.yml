name: Generate Snake Animation

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Jobs to update snake svg
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Rida1019-taki
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C77B9B&color_dots=#190B12,#451126,#701A3D,#C77B9B,#E5B5C7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C77B9B&color_dots=#10070C,#190B12,#451126,#701A3D,#C77B9B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
